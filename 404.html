<!doctype html>
<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nicht gefunden | Medienspeicher</title>
<meta name="robots" content="noindex">

     relative links need the site root as base. On an own domain this
     becomes "/" (see CLAUDE.md). -->
<base href="/Medienspeicher/">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="stylesheet" href="assets/css/app.css">
<script src="js/boot.js"></script>
</head>
<body>
<div id="site-header"></div>

        <img class="win-bar-icon" src="assets/img/floppy.webp" alt="" width="64" height="64">

      <div class="win-body nf-body">

          <div class="mt-8 flex flex-wrap gap-4">
            <a class="btn btn-lg" href="./"><span>Zur Startseite</span></a>
            <a class="btn btn-glass btn-lg" href="videos/"><span>Zu den Videos</span></a>

<div id="site-footer"></div>

<script type="module" src="js/layout.js"></script>
