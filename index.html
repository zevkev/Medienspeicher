<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medienspeicher Galerie</title>
    <style>
        :root {
            --bg: #0b0e14;
            --accent: #00d4ff;
            --card: #161b22;
            --text: #f0f6fc;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Schickes Hintergrund-Raster */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 212, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        header {
            padding: 30px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        h1 { margin: 0; letter-spacing: 3px; font-weight: 300; }
        h1 span { color: var(--accent); font-weight: 800; }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h2 {
            border-left: 4px solid var(--accent);
            padding-left: 15px;
            margin: 40px 0 20px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        /* Galerie-Gitter */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }

        .info {
            padding: 12px;
            font-size: 0.8rem;
            text-align: center;
            background: rgba(0,0,0,0.3);
            color: #8b949e;
        }

        /* Lightbox */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }

        #lightbox img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 5px;
            box-shadow: 0 0 30px rgba(0,212,255,0.2);
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>

<header>
    <h1>MEDIEN<span>SPEICHER</span></h1>
</header>

<div class="container">
    <section>
        <h2>🖼️ Hauptordner</h2>
        <div id="gal-main" class="gallery"></div>
    </section>

    <section>
        <h2>📁 Jason</h2>
        <div id="gal-jason" class="gallery"></div>
    </section>

    <section>
        <h2>📁 Kev</h2>
        <div id="gal-kev" class="gallery"></div>
    </section>

    <section>
        <h2>⛏️ MC Server</h2>
        <div id="gal-mc" class="gallery"></div>
    </section>
</div>

<div id="lightbox" onclick="this.style.display='none'">
    <img id="lb-img" src="">
</div>

<script>
    // BASIS-PFAD (Hier liegen alle deine Bilder)
    const base = "Bilder/";

    // DATEILISTEN
    const files = {
        main: ["Jamon.jpg", "Medienspeicher.png", "TTT.png", "ZevKev.png", "bello.jpg", "neues icon.png"],
        jason: ["Jason/Banner new jpeg.jpg", "Jason/Park.jpg", "Jason/Video BG Jamon.png", "Jason/YT.jpg", "Jason/dis.jpg", "Jason/frei.jpg"],
        kev: ["kev/1760363756349.png", "kev/Banner new jpeg.jpg", "kev/Video BG.png", "kev/neues icon.png"],
        mc: ["mcserver/DeathSwap.png", "mcserver/Fortune.png", "mcserver/Survival.png", "mcserver/TTT.png", "mcserver/Temp.png", "mcserver/TheBridge.png", "mcserver/itemchaos.png", "mcserver/kitpvp.png"]
    };

    function load(list, elementId) {
        const container = document.getElementById(elementId);
        list.forEach(name => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // WICHTIG: base + name ergibt "Bilder/Ordner/Datei.png"
            const fullPath = base + name;
            const encodedPath = encodeURI(fullPath);

            card.innerHTML = `
                <img src="${encodedPath}" loading="lazy" onerror="console.log('Fehler bei: ' + this.src); this.parentElement.style.display='none'">
                <div class="info">${name.split('/').pop()}</div>
            `;

            card.onclick = () => {
                document.getElementById('lb-img').src = encodedPath;
                document.getElementById('lightbox').style.display = 'flex';
            };

            container.appendChild(card);
        });
    }

    // Galerien befüllen
    load(files.main, 'gal-main');
    load(files.jason, 'gal-jason');
    load(files.kev, 'gal-kev');
    load(files.mc, 'gal-mc');
</script>

</body>
</html>
