<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Medienspeicher Galerie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link id="dynamic-favicon" rel="icon" href="">

    <style>
        /* CSS bleibt größtenteils gleich, kleine Fixes für die Anzeige */
        #login-screen {
            position: fixed;
            inset: 0;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", sans-serif;
            z-index: 99999;
        }

        #login-box {
            background: rgba(255,255,255,0.08);
            padding: 40px;
            border-radius: 18px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
            text-align: center;
        }

        #login-box input {
            padding: 12px 18px;
            border-radius: 12px;
            border: none;
            width: 220px;
            margin-top: 10px;
            font-size: 1.1em;
            outline: none;
            text-align: center;
        }

        #login-box button {
            margin-top: 18px;
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            background: #7c7cff;
            color: white;
            font-size: 1.1em;
            cursor: pointer;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #1a1a1a;
            font-family: "Segoe UI", Arial, sans-serif;
            color: white;
        }

        .blueprint-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: #111;
        }

        .grid-fine {
            position: absolute;
            inset: 0;
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 35px;
        }

        section {
            max-width: 1500px;
            margin: auto;
            padding: 30px 35px 50px;
        }

        section h2 {
            border-left: 5px solid #7c7cff;
            padding-left: 15px;
            margin-bottom: 25px;
        }

        .masonry {
            column-count: 4;
            column-gap: 26px;
        }

        @media (max-width: 1200px) { .masonry { column-count: 3; } }
        @media (max-width: 800px)  { .masonry { column-count: 2; } }
        @media (max-width: 500px)  { .masonry { column-count: 1; } }

        .card {
            break-inside: avoid;
            margin-bottom: 26px;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: transform .4s, box-shadow .4s;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .card img {
            width: 100%;
            display: block;
        }

        .overlay {
            padding: 12px;
            background: rgba(0,0,0,0.6);
            font-size: 0.9em;
            text-align: center;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999999;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div id="login-box">
        <h2>🔒 Passwort erforderlich</h2>
        <input type="password" id="pw" placeholder="Passwort" onkeydown="if(event.key==='Enter') checkPW()">
        <br>
        <button onclick="checkPW()">Login</button>
    </div>
</div>

<div class="blueprint-bg">
    <div class="grid-fine"></div>
</div>

<header>
    <h1>📸 Medienspeicher</h1>
    <div style="cursor:pointer; font-size: 1.5em;" onclick="startSlideshow()">▶️ Slideshow</div>
</header>

<section>
    <h2>🖼️ Hauptgalerie</h2>
    <div id="gallery-main" class="masonry"></div>
</section>

<section>
    <h2>⛏️ MC Server</h2>
    <div id="gallery-mc" class="masonry"></div>
</section>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="">
</div>

<script>
/* --- PASSWORT --- */
function checkPW() {
    const pw = document.getElementById("pw").value;
    if (pw === "MSPR2026") {
        document.getElementById("login-screen").style.display = "none";
    } else {
        alert("Falsches Passwort");
    }
}

/* --- DATEILISTEN (basierend auf deinen Screenshots) --- */
const extensions = ["png", "jpg", "jpeg", "webp"];

const rootFiles = ["Jamon", "Medienspeicher", "TTT", "ZevKev", "bello", "neues icon"];
const jasonFiles = ["Jason/Banner new jpeg", "Jason/Park", "Jason/Video BG Jamon", "Jason/YT", "Jason/dis", "Jason/frei"];
const kevFiles = ["kev/1760363756349", "kev/Banner new jpeg", "kev/Video BG", "kev/neues icon"];
const mcFiles = ["mcserver/DeathSwap", "mcserver/Fortune", "mcserver/Survival", "mcserver/TTT", "mcserver/Temp", "mcserver/TheBridge", "mcserver/itemchaos", "mcserver/kitpvp"];

let allLoadedImages = [];

/* --- LADE-FUNKTION --- */
function tryLoadImage(basePath, containerId) {
    const container = document.getElementById(containerId);
    let attempt = 0;

    function next() {
        if (attempt >= extensions.length) return;
        
        const ext = extensions[attempt];
        const fullPath = `${basePath}.${ext}`;
        const img = new Image();
        
        // encodeURI fix für Leerzeichen im Dateinamen
        img.src = encodeURI(fullPath);

        img.onload = () => {
            const card = document.createElement("div");
            card.className = "card";
            card.onclick = () => openLightbox(img.src);
            
            const titleText = basePath.split('/').pop().replace(/[_-]/g, " ");
            card.innerHTML = `<img src="${img.src}"><div class="overlay">${titleText}</div>`;
            
            container.appendChild(card);
            allLoadedImages.push(img.src);
        };

        img.onerror = () => {
            attempt++;
            next();
        };
    }
    next();
}

/* --- INITIALISIERUNG --- */
rootFiles.forEach(f => tryLoadImage(f, "gallery-main"));
jasonFiles.forEach(f => tryLoadImage(f, "gallery-main"));
kevFiles.forEach(f => tryLoadImage(f, "gallery-main"));
mcFiles.forEach(f => tryLoadImage(f, "gallery-mc"));

/* --- LIGHTBOX & SLIDESHOW --- */
function openLightbox(src) {
    const lb = document.getElementById("lightbox");
    const lbImg = document.getElementById("lightbox-img");
    lbImg.src = src;
    lb.classList.add("active");
}

function closeLightbox() {
    document.getElementById("lightbox").classList.remove("active");
    stopSlideshow();
}

let slideInterval;
function startSlideshow() {
    if (allLoadedImages.length === 0) return;
    let i = 0;
    openLightbox(allLoadedImages[i]);
    slideInterval = setInterval(() => {
        i = (i + 1) % allLoadedImages.length;
        document.getElementById("lightbox-img").src = allLoadedImages[i];
    }, 3000);
}

function stopSlideshow() {
    clearInterval(slideInterval);
}
</script>

</body>
</html>
