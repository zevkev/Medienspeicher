<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Medienspeicher Galerie</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link id="dynamic-favicon" rel="icon" href="">

<style>

/* --------------------------------------------------
   PASSWORD SCREEN
-------------------------------------------------- */
#login-screen {
    position: fixed;
    inset: 0;
    background: #111;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", sans-serif;
    z-index: 99999;
}

#login-box {
    background: rgba(255,255,255,0.08);
    padding: 40px;
    border-radius: 18px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 25px rgba(0,0,0,0.4);
    text-align: center;
}

#login-box input {
    padding: 12px 18px;
    border-radius: 12px;
    border: none;
    width: 220px;
    margin-top: 10px;
    font-size: 1.1em;
    outline: none;
    text-align: center;
}

#login-box button {
    margin-top: 18px;
    padding: 12px 20px;
    border-radius: 12px;
    border: none;
    background: #7c7cff;
    color: white;
    font-size: 1.1em;
    cursor: pointer;
}

/* --------------------------------------------------
   BLUEPRINT BACKGROUND (from test.html)
-------------------------------------------------- */

html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #2a2a2a;
    font-family: "Segoe UI", Arial, sans-serif;
    color: white;
}

.blueprint-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
}

.texture, .grid-fine, .grid-bold, .vignette {
    position: absolute;
    inset: 0;
}

.texture {
    background:
        repeating-linear-gradient(0deg,
            rgba(255,255,255,0.01) 0px,
            rgba(255,255,255,0.01) 2px,
            rgba(0,0,0,0.02) 4px);
    mix-blend-mode: overlay;
    animation: drift 22s linear infinite;
}

.grid-fine {
    background-size: 40px 40px;
    background-image:
        linear-gradient(to right, rgba(200,200,200,0.2) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(200,200,200,0.2) 1px, transparent 1px);
    animation: drift 50s linear infinite;
}

.grid-bold {
    background-size: 200px 200px;
    background-image:
        linear-gradient(to right, rgba(220,220,220,0.3) 2px, transparent 2px),
        linear-gradient(to bottom, rgba(220,220,220,0.3) 2px, transparent 2px);
    animation: drift 90s linear infinite;
}

.vignette {
    background: radial-gradient(circle at center,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,0.5) 100%);
}

@keyframes drift {
    from { background-position: 0 0; }
    to   { background-position: 600px 600px; }
}

/* --------------------------------------------------
   GALLERY DESIGN
-------------------------------------------------- */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 35px;
}

.controls {
    display: flex;
    gap: 18px;
    cursor: pointer;
    font-size: 1.5em;
}

section {
    max-width: 1500px;
    margin: auto;
    padding: 30px 35px 50px;
}

section h2 {
    border-left: 5px solid #7c7cff;
    padding-left: 15px;
}

.masonry {
    column-count: 4;
    column-gap: 26px;
}

@media (max-width: 1200px) { .masonry { column-count: 3; } }
@media (max-width: 800px)  { .masonry { column-count: 2; } }
@media (max-width: 500px)  { .masonry { column-count: 1; } }

.card {
    break-inside: avoid;
    margin-bottom: 26px;
    border-radius: 18px;
    overflow: hidden;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(8px);
    cursor: pointer;
    transition: transform .4s, box-shadow .4s;
}

.card:hover {
    transform: translateY(-6px) scale(1.03);
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
}

.card img {
    width: 100%;
    display: block;
    transition: transform .6s ease;
}

.card:hover img {
    transform: scale(1.1);
}

.overlay {
    padding: 14px 16px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
}

.title {
    font-weight: 600;
}

/* Lightbox */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 999;
}
.lightbox.active { display: flex; }
.lightbox img {
    max-width: 92%;
    max-height: 92%;
    border-radius: 20px;
}

</style>
</head>

<body>

<!-- PASSWORD -->
<div id="login-screen">
    <div id="login-box">
        <h2>🔒 Passwort erforderlich</h2>
        <input type="password" id="pw" placeholder="Passwort">
        <br>
        <button onclick="checkPW()">Login</button>
    </div>
</div>

<!-- BACKGROUND -->
<div class="blueprint-bg">
    <div class="texture"></div>
    <div class="grid-fine"></div>
    <div class="grid-bold"></div>
    <div class="vignette"></div>
</div>

<header>
    <h1>📸 Medienspeicher</h1>
    <div class="controls">
        <div onclick="toggleTheme()">🌙</div>
        <div onclick="startSlideshow()">▶️</div>
    </div>
</header>

<section>
    <h2>🖼️ Galerie</h2>
    <div id="gallery-main" class="masonry"></div>
</section>

<section>
    <h2>⛏️ MC Server</h2>
    <div id="gallery-mc" class="masonry"></div>
</section>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img">
</div>

<script>

/* -------------------------------------------
   PASSWORD
------------------------------------------- */

function checkPW() {
    const pw = document.getElementById("pw").value;
    if (pw === "MSPR2026") {
        document.getElementById("login-screen").style.display = "none";
    } else {
        alert("Falsches Passwort");
    }
}

/* --------------------------------------------------
   ALL IMAGE PATHS (OLD + NEW)
-------------------------------------------------- */

const endungen = ["png","jpg","jpeg","webp"];

/* Root directory images */
const rootImages = [
    "Jamon",
    "Medienspeicher",
    "TTT",
    "ZevKev",
    "bello",
    "neues icon"
];

/* Jason folder */
const jasonImages = [
    "Jason/Banner new jpeg",
    "Jason/dis",
    "Jason/frei",
    "Jason/Park",
    "Jason/Video BG Jamon",
    "Jason/YT"
];

/* kev folder */
const kevImages = [
    "kev/1760363756349",
    "kev/Banner new jpeg",
    "kev/neues icon",
    "kev/Video BG"
];

/* mcserver folder (use all old entries) */
const mcImages = [
    "mcserver/DeathSwap",
    "mcserver/Survival",
    "mcserver/Temp",
    "mcserver/itemchaos",
    "mcserver/kitpvp",
    "mcserver/TTT",
    "mcserver/Fortune",
    "mcserver/TheBridge"
];

const allImages = [];

/* Image loader */
function loadImage(fullPath, container) {
    let i = 0;
    const img = new Image();

    function tryNext() {
        if (i >= endungen.length) return;
        img.src = fullPath + "." + endungen[i++];
    }

    img.onload = () => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => openLightbox(img.src);

        const overlay = document.createElement("div");
        overlay.className = "overlay";

        let title = fullPath.split("/").pop().replace(/[_-]/g," ");
        overlay.innerHTML = `<div class="title">${title}</div>`;

        card.appendChild(img);
        card.appendChild(overlay);
        container.appendChild(card);

        allImages.push(img.src);
    };

    img.onerror = tryNext;
    tryNext();
}

function loadList(list, container) {
    list.forEach(path => loadImage(path, container));
}

/* Load everything */
loadList(rootImages, document.getElementById("gallery-main"));
loadList(jasonImages, document.getElementById("gallery-main"));
loadList(kevImages, document.getElementById("gallery-main"));
loadList(mcImages, document.getElementById("gallery-mc"));

/* -------------------------------------------
   LIGHTBOX
------------------------------------------- */

function openLightbox(src) {
    document.getElementById("lightbox-img").src = src;
    document.getElementById("lightbox").classList.add("active");
}
function closeLightbox() {
    document.getElementById("lightbox").classList.remove("active");
    stopSlideshow();
}

/* -------------------------------------------
   SLIDESHOW
------------------------------------------- */

let slideIndex = 0;
let slideTimer = null;

function startSlideshow() {
    if (!allImages.length) return;
    slideIndex = 0;
    openLightbox(allImages[0]);

    slideTimer = setInterval(() => {
        slideIndex = (slideIndex + 1) % allImages.length;
        document.getElementById("lightbox-img").src = allImages[slideIndex];
    }, 3000);
}

function stopSlideshow() {
    clearInterval(slideTimer);
}

/* Theme */
function toggleTheme() {
    document.body.classList.toggle("light");
}

/* Set random favicon */
setTimeout(() => {
    if (allImages.length) {
        document.getElementById("dynamic-favicon").href =
            allImages[Math.floor(Math.random()*allImages.length)];
    }
}, 2500);

</script>

</body>
</html>
</html>
